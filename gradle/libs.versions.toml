[versions]
# ─── Build Tools ────────────────────────────────────────────────────
agp                         = "8.7.3"
kotlin                      = "2.1.0"
ksp                         = "2.1.0-1.0.29"

# ─── Core Android ───────────────────────────────────────────────────
coreKtx                     = "1.15.0"
lifecycleRuntimeKtx         = "2.8.7"
activityCompose             = "1.9.3"

# ─── Compose ────────────────────────────────────────────────────────
composeBom                  = "2024.12.01"
navigationCompose           = "2.8.5"
lifecycleViewmodelCompose   = "2.8.7"

# ─── Hilt ───────────────────────────────────────────────────────────
hilt                        = "2.54"
hiltNavigationCompose       = "1.2.0"
hiltWork                    = "1.2.0"
hiltCompiler                = "1.2.0"

# ─── Room ───────────────────────────────────────────────────────────
room                        = "2.6.1"

# ─── WorkManager ────────────────────────────────────────────────────
workManager                 = "2.10.0"

# ─── Health Connect ─────────────────────────────────────────────────
healthConnect               = "1.1.0-alpha10"

# ─── Glance ─────────────────────────────────────────────────────────
glance                      = "1.1.1"

# ─── DataStore ──────────────────────────────────────────────────────
datastore                   = "1.1.2"

# ─── Gemini ─────────────────────────────────────────────────────────
generativeai                = "0.9.0"

# ─── Kotlinx ────────────────────────────────────────────────────────
coroutines                  = "1.9.0"
serialization               = "1.7.3"

# ─── Splash Screen ──────────────────────────────────────────────────
splashscreen                = "1.0.1"

# ─── Accompanist ────────────────────────────────────────────────────
accompanist                 = "0.36.0"

# ─── Testing ────────────────────────────────────────────────────────
junit                       = "4.13.2"
junitExt                    = "1.2.1"
espresso                    = "3.6.1"
mockk                       = "1.13.14"

[libraries]
# ─── Core Android ───────────────────────────────────────────────────
androidx-core-ktx                     = { group = "androidx.core",       name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx        = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose             = { group = "androidx.activity",   name = "activity-compose",            version.ref = "activityCompose" }

# ─── Compose BOM ────────────────────────────────────────────────────
androidx-compose-bom                  = { group = "androidx.compose",    name = "compose-bom",                 version.ref = "composeBom" }
androidx-ui                           = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics                  = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview           = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling                   = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-junit4               = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest             = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3                    = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended      = { group = "androidx.compose.material", name = "material-icons-extended" }

# ─── Navigation ─────────────────────────────────────────────────────
androidx-navigation-compose           = { group = "androidx.navigation", name = "navigation-compose",          version.ref = "navigationCompose" }

# ─── Lifecycle ──────────────────────────────────────────────────────
androidx-lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose    = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose",   version.ref = "lifecycleViewmodelCompose" }

# ─── Hilt ───────────────────────────────────────────────────────────
hilt-android                          = { group = "com.google.dagger",   name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                         = { group = "com.google.dagger",   name = "hilt-android-compiler",       version.ref = "hilt" }
androidx-hilt-navigation-compose      = { group = "androidx.hilt",       name = "hilt-navigation-compose",     version.ref = "hiltNavigationCompose" }
androidx-hilt-work                    = { group = "androidx.hilt",       name = "hilt-work",                   version.ref = "hiltWork" }
androidx-hilt-compiler                = { group = "androidx.hilt",       name = "hilt-compiler",               version.ref = "hiltCompiler" }

# ─── Room ───────────────────────────────────────────────────────────
androidx-room-runtime                 = { group = "androidx.room",       name = "room-runtime",                version.ref = "room" }
androidx-room-ktx                     = { group = "androidx.room",       name = "room-ktx",                    version.ref = "room" }
androidx-room-compiler                = { group = "androidx.room",       name = "room-compiler",               version.ref = "room" }

# ─── WorkManager ────────────────────────────────────────────────────
androidx-work-runtime-ktx             = { group = "androidx.work",       name = "work-runtime-ktx",            version.ref = "workManager" }

# ─── Health Connect ─────────────────────────────────────────────────
androidx-health-connect-client        = { group = "androidx.health.connect", name = "connect-client",          version.ref = "healthConnect" }

# ─── Glance ─────────────────────────────────────────────────────────
androidx-glance-appwidget             = { group = "androidx.glance",     name = "glance-appwidget",            version.ref = "glance" }
androidx-glance-material3             = { group = "androidx.glance",     name = "glance-material3",            version.ref = "glance" }

# ─── DataStore ──────────────────────────────────────────────────────
androidx-datastore-preferences        = { group = "androidx.datastore",  name = "datastore-preferences",       version.ref = "datastore" }

# ─── Gemini ─────────────────────────────────────────────────────────
generativeai                          = { group = "com.google.ai.client.generativeai", name = "generativeai", version.ref = "generativeai" }

# ─── Kotlinx ────────────────────────────────────────────────────────
kotlinx-coroutines-android            = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json            = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test               = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }

# ─── Splash Screen ──────────────────────────────────────────────────
androidx-core-splashscreen            = { group = "androidx.core",       name = "core-splashscreen",           version.ref = "splashscreen" }

# ─── Accompanist ────────────────────────────────────────────────────
accompanist-permissions               = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

# ─── Testing ────────────────────────────────────────────────────────
junit                                 = { group = "junit",               name = "junit",                       version.ref = "junit" }
androidx-junit                        = { group = "androidx.test.ext",   name = "junit",                       version.ref = "junitExt" }
androidx-espresso-core                = { group = "androidx.test.espresso", name = "espresso-core",           version.ref = "espresso" }
mockk                                 = { group = "io.mockk",            name = "mockk",                       version.ref = "mockk" }

[plugins]
android-application       = { id = "com.android.application",           version.ref = "agp" }
kotlin-android            = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-compose            = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization      = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                       = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
hilt                      = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
